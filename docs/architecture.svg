<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title description">
  <title id="title">Nakhla IT Helpdesk architecture</title>
  <desc id="description">The Gradio UI calls the FastAPI chat and approval endpoints. The chat workflow applies input screening, restores SQLite state, reads employee and service data through MCP, retrieves semantically ranked current knowledge-base content, runs two LangGraph roles, applies deterministic policy, and validates output. Ticket writes follow a separate approval-only path through a stored draft and MCP.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .heading { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 13px Arial, sans-serif; fill: #334155; }
      .small { font: 400 12px Arial, sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .safe { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .data { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
      .external { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
      .approval { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.2; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .write { fill: none; stroke: #e11d48; stroke-width: 2.2; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="850" fill="#ffffff"/>
  <text class="title" x="48" y="52">Nakhla IT Helpdesk Agent</text>
  <text class="subtitle" x="48" y="78">Grounded assistance with deterministic policy controls and an approval-gated ticket write</text>

  <rect class="lane" x="32" y="108" width="1376" height="445" rx="14"/>
  <text class="heading" x="56" y="138">CHAT PATH — POST /api/chat</text>

  <rect class="box" x="62" y="175" width="155" height="92" rx="10"/>
  <text class="heading" x="105" y="213">Gradio UI</text>
  <text class="small" x="82" y="238">Chat, citations, draft</text>

  <rect class="box" x="272" y="175" width="165" height="92" rx="10"/>
  <text class="heading" x="309" y="213">FastAPI</text>
  <text class="small" x="296" y="238">Contract boundary</text>

  <rect class="safe" x="492" y="175" width="175" height="92" rx="10"/>
  <text class="heading" x="527" y="207">Input screening</text>
  <text class="small" x="514" y="231">Block injection / secrets</text>
  <text class="small" x="531" y="248">before all tools</text>

  <rect class="data" x="722" y="160" width="202" height="122" rx="10"/>
  <text class="heading" x="759" y="196">SQLite state</text>
  <text class="small" x="744" y="220">Session: email, issue,</text>
  <text class="small" x="742" y="237">decision, pending actions</text>
  <text class="small" x="750" y="254">Requester memory</text>

  <rect class="box" x="978" y="160" width="186" height="122" rx="10"/>
  <text class="heading" x="1021" y="196">MCP reads</text>
  <text class="small" x="1001" y="220">Employee + status</text>
  <text class="small" x="998" y="237">Structured tool logs</text>
  <text class="small" x="1010" y="254">No write capability</text>

  <rect class="external" x="1218" y="160" width="150" height="122" rx="10"/>
  <text class="heading" x="1233" y="196">Simulator</text>
  <text class="small" x="1237" y="220">Helpdesk API</text>
  <text class="small" x="1237" y="237">:8102</text>

  <path class="line" d="M217 221 H272"/>
  <path class="line" d="M437 221 H492"/>
  <path class="line" d="M667 221 H722"/>
  <path class="line" d="M924 221 H978"/>
  <path class="line" d="M1164 221 H1218"/>

  <rect class="data" x="102" y="365" width="280" height="120" rx="10"/>
  <text class="heading" x="147" y="400">Knowledge retrieval</text>
  <text class="small" x="123" y="424">Chroma: chunks + vectors</text>
  <text class="small" x="123" y="441">Exact error-code + cosine ranking</text>
  <text class="small" x="123" y="458">Current-source precedence filtering</text>

  <rect class="external" x="434" y="365" width="172" height="120" rx="10"/>
  <text class="heading" x="466" y="400">OpenRouter</text>
  <text class="small" x="456" y="424">Embeddings at ingest</text>
  <text class="small" x="454" y="441">Role inference at chat</text>

  <rect class="safe" x="660" y="350" width="280" height="150" rx="10"/>
  <text class="heading" x="719" y="386">LangGraph roles</text>
  <text class="small" x="685" y="414">1. Intake &amp; Safety: topic + context</text>
  <text class="small" x="685" y="434">2. Resolution &amp; Escalation:</text>
  <text class="small" x="703" y="452">answer / escalate / draft route</text>
  <text class="small" x="689" y="476">No ticket write tools</text>

  <rect class="safe" x="996" y="350" width="330" height="150" rx="10"/>
  <text class="heading" x="1036" y="386">Deterministic policy and output</text>
  <text class="small" x="1022" y="414">Incident, department, priority, approval rules</text>
  <text class="small" x="1022" y="434">Citation / confirmed-ticket-ID validation</text>
  <text class="small" x="1022" y="454">Cited response, escalation offer, or draft</text>
  <text class="small" x="1022" y="476">returned through the FastAPI contract</text>

  <path class="dashed" d="M824 282 V365 H382"/>
  <path class="line" d="M382 425 H434"/>
  <path class="line" d="M606 425 H660"/>
  <path class="line" d="M940 425 H996"/>
  <path class="dashed" d="M996 475 H352 V267"/>

  <rect class="lane" x="32" y="588" width="1376" height="220" rx="14"/>
  <text class="heading" x="56" y="618">APPROVAL-ONLY WRITE PATH — POST /api/approve</text>

  <rect class="approval" x="90" y="655" width="195" height="100" rx="10"/>
  <text class="heading" x="126" y="691">User approval</text>
  <text class="small" x="112" y="716">UI sends action_id +</text>
  <text class="small" x="127" y="733">approved boolean</text>

  <rect class="data" x="365" y="640" width="245" height="130" rx="10"/>
  <text class="heading" x="412" y="677">Stored TicketDraft</text>
  <text class="small" x="388" y="702">Server-side, schema-validated</text>
  <text class="small" x="398" y="720">action_id is idempotency key</text>
  <text class="small" x="392" y="738">Reject / unknown: no write</text>

  <rect class="approval" x="695" y="655" width="210" height="100" rx="10"/>
  <text class="heading" x="741" y="691">Approval service</text>
  <text class="small" x="720" y="716">Consumes only after reject</text>
  <text class="small" x="721" y="733">or confirmed write success</text>

  <rect class="box" x="988" y="655" width="170" height="100" rx="10"/>
  <text class="heading" x="1030" y="691">MCP write</text>
  <text class="small" x="1012" y="716">create_ticket only</text>
  <text class="small" x="1015" y="733">after approval</text>

  <rect class="external" x="1230" y="655" width="140" height="100" rx="10"/>
  <text class="heading" x="1245" y="691">Helpdesk API</text>
  <text class="small" x="1259" y="716">Real IT-####</text>
  <text class="small" x="1254" y="733">or retryable error</text>

  <path class="write" d="M285 705 H365"/>
  <path class="write" d="M610 705 H695"/>
  <path class="write" d="M905 705 H988"/>
  <path class="write" d="M1158 705 H1230"/>
</svg>
