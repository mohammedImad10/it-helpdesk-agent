<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">IT Helpdesk Agent architecture overview</title>
  <desc id="description">A rendered overview of the helpdesk agent chat and approval paths. The chat path runs from Gradio through FastAPI, input security, session state, MCP reads, Chroma retrieval, LangGraph roles, policy, and output validation. The separate lower path permits ticket writes only after explicit approval of a stored draft.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="writeArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#e11d48"/>
    </marker>
    <style>
      .title { font: 700 29px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #475569; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .heading { font: 700 15px Arial, sans-serif; fill: #0f172a; }
      .label { font: 700 13px Arial, sans-serif; fill: #0f172a; }
      .text { font: 400 12px Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Arial, sans-serif; fill: #475569; }
      .blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.8; }
      .green { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
      .purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.8; }
      .orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.8; }
      .red { fill: #fff1f2; stroke: #e11d48; stroke-width: 2.2; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .write { fill: none; stroke: #e11d48; stroke-width: 2.3; marker-end: url(#writeArrow); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#ffffff"/>
  <text class="title" x="48" y="52">IT Helpdesk Agent Architecture</text>
  <text class="subtitle" x="48" y="78">Grounded support with controlled AI routing and an approval-gated ticket write</text>

  <rect class="lane" x="32" y="108" width="1376" height="478" rx="14"/>
  <text class="heading" x="56" y="139">CHAT PATH - POST /api/chat</text>

  <rect class="blue" x="62" y="180" width="138" height="88" rx="10"/>
  <text class="label" x="95" y="216">Gradio UI</text>
  <text class="small" x="84" y="239">message, email,</text>
  <text class="small" x="92" y="255">citations</text>

  <rect class="blue" x="248" y="180" width="145" height="88" rx="10"/>
  <text class="label" x="286" y="216">FastAPI</text>
  <text class="small" x="267" y="239">contract boundary</text>
  <text class="small" x="281" y="255">port 8000</text>

  <rect class="green" x="441" y="180" width="163" height="88" rx="10"/>
  <text class="label" x="472" y="210">Input security</text>
  <text class="small" x="463" y="235">block injection and</text>
  <text class="small" x="477" y="251">secret requests</text>

  <rect class="blue" x="652" y="180" width="170" height="88" rx="10"/>
  <text class="label" x="694" y="210">Workflow</text>
  <text class="small" x="674" y="235">Python orchestration</text>
  <text class="small" x="682" y="251">and policy control</text>

  <rect class="purple" x="870" y="165" width="180" height="118" rx="10"/>
  <text class="label" x="918" y="198">SQLite</text>
  <text class="small" x="891" y="222">session, awaiting,</text>
  <text class="small" x="891" y="239">drafts, requester</text>
  <text class="small" x="916" y="256">memory</text>

  <rect class="orange" x="1098" y="165" width="138" height="118" rx="10"/>
  <text class="label" x="1139" y="198">MCP reads</text>
  <text class="small" x="1114" y="222">employee, status,</text>
  <text class="small" x="1113" y="239">ticket history and</text>
  <text class="small" x="1127" y="256">ticket status</text>

  <rect class="orange" x="1284" y="165" width="84" height="118" rx="10"/>
  <text class="label" x="1295" y="201">API</text>
  <text class="small" x="1294" y="224">simulator</text>
  <text class="small" x="1305" y="241">:8102</text>

  <path class="line" d="M200 224 H248"/>
  <path class="line" d="M393 224 H441"/>
  <path class="line" d="M604 224 H652"/>
  <path class="dashed" d="M822 206 H870"/>
  <path class="line" d="M822 242 H1098"/>
  <path class="line" d="M1236 224 H1284"/>

  <rect class="purple" x="390" y="370" width="176" height="118" rx="10"/>
  <text class="label" x="422" y="403">Chroma retrieval</text>
  <text class="small" x="410" y="427">vectors, metadata,</text>
  <text class="small" x="410" y="444">current-source and</text>
  <text class="small" x="417" y="461">precedence ranking</text>

  <rect class="orange" x="613" y="370" width="155" height="118" rx="10"/>
  <text class="label" x="648" y="403">OpenRouter</text>
  <text class="small" x="635" y="427">optional embeddings</text>
  <text class="small" x="632" y="444">and structured role</text>
  <text class="small" x="656" y="461">decisions</text>

  <rect class="purple" x="815" y="355" width="190" height="148" rx="10"/>
  <text class="label" x="861" y="387">LangGraph</text>
  <text class="small" x="844" y="413">1. Intake and Safety</text>
  <text class="small" x="834" y="433">2. Resolution and Escalation</text>
  <text class="small" x="842" y="463">answer / escalate / draft</text>

  <rect class="green" x="1052" y="355" width="172" height="148" rx="10"/>
  <text class="label" x="1071" y="387">Policy and output</text>
  <text class="small" x="1071" y="413">department rules,</text>
  <text class="small" x="1067" y="433">citations, ticket-ID</text>
  <text class="small" x="1083" y="450">verification</text>
  <text class="small" x="1091" y="474">safe response</text>

  <path class="line" d="M737 268 V329 H478 V370"/>
  <path class="line" d="M737 268 V329 H910 V355"/>
  <path class="dashed" d="M690 370 V333 H737 V268"/>
  <path class="dashed" d="M768 429 H815"/>
  <path class="line" d="M1005 429 H1052"/>
  <path class="line" d="M1052 488 H137 V268"/>

  <rect class="lane" x="32" y="622" width="1376" height="186" rx="14"/>
  <text class="heading" x="56" y="653">APPROVAL-ONLY WRITE PATH - POST /api/approve</text>

  <rect class="blue" x="62" y="686" width="158" height="76" rx="10"/>
  <text class="label" x="89" y="718">UI approval</text>
  <text class="small" x="81" y="741">action_id + decision</text>

  <rect class="blue" x="275" y="686" width="142" height="76" rx="10"/>
  <text class="label" x="309" y="718">FastAPI</text>
  <text class="small" x="294" y="741">/api/approve</text>

  <rect class="purple" x="472" y="670" width="195" height="108" rx="10"/>
  <text class="label" x="506" y="703">Stored TicketDraft</text>
  <text class="small" x="491" y="727">server validates fields</text>
  <text class="small" x="505" y="744">and loads action</text>
  <text class="small" x="504" y="761">idempotency key</text>

  <rect class="red" x="722" y="670" width="168" height="108" rx="10"/>
  <text class="label" x="752" y="703">Approval gate</text>
  <text class="small" x="750" y="727">reject: no write</text>
  <text class="small" x="743" y="744">failure: retry draft</text>
  <text class="small" x="745" y="761">approve: write once</text>

  <rect class="orange" x="945" y="686" width="151" height="76" rx="10"/>
  <text class="label" x="978" y="718">MCP write</text>
  <text class="small" x="962" y="741">create_ticket only</text>

  <rect class="orange" x="1151" y="686" width="166" height="76" rx="10"/>
  <text class="label" x="1172" y="718">Helpdesk API</text>
  <text class="small" x="1174" y="741">confirmed IT-####</text>

  <path class="line" d="M220 724 H275"/>
  <path class="line" d="M417 724 H472"/>
  <path class="line" d="M667 724 H722"/>
  <path class="write" d="M890 724 H945"/>
  <path class="write" d="M1096 724 H1151"/>

  <rect x="1018" y="836" width="18" height="12" rx="2" fill="#eff6ff" stroke="#2563eb"/>
  <text class="small" x="1042" y="847">application boundary</text>
  <rect x="1152" y="836" width="18" height="12" rx="2" fill="#ecfdf5" stroke="#059669"/>
  <text class="small" x="1176" y="847">safety control</text>
  <rect x="1272" y="836" width="18" height="12" rx="2" fill="#fff1f2" stroke="#e11d48"/>
  <text class="small" x="1296" y="847">write boundary</text>
</svg>
